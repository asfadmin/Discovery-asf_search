tests:
  - test-ASFSearch ALOS Resp 1:
      response: Alos_response_maxResults3.yml
  - test-ASFSearch S1 Resp 1:
      response: S1_baseline_stack.yml
  - test-ASFSearch-search-valid Alos:
      parameters:
        platform: ALOS
        maxResults: 3
      answer: Alos_response_maxResults3.yml
  - test-ASFSearch-search-error 400-Error:
      parameters: {}
      status_code: 400
      report: "Client Error: This is a Test Error"
  - test-ASFSearch-search-error 400-Error non-empty-results:
      parameters:
        platform: Sentinel-1
      status_code: 400
      report: "Client Error: This is a Test Error"
  - test-ASFSearch-search-error 500-Error:
      parameters: {}
      status_code: 500
      report: "Server Error: This is a Test Error"
  - test-ASFSearch-search-error 500-Error non-empty-results:
      parameters:
        platform: Sentinel-1
      status_code: 500
      report: "Server Error: This is a Test Error"
  - test-search-dataset S1 Datasets:
      dataset:
        - SENTINEL-1
        - SLC-BURST
        - OPERA-S1
  - test-search-dataset S1 Datasets and non-S1:
      dataset:
        - SENTINEL-1
        - SLC-BURST
        - OPERA-S1
        - UAVSAR
  - test-search-dataset fake dataset:
      dataset: FAKE-DATASET-V1
  - test-search-dataset S1 Datasets and fake dataset:
      dataset:
        - SENTINEL-1
        - SLC-BURST
        - OPERA-S1
        - FAKE-DATASET-V2
  - test-search-dataset ALOS Datasets:
      dataset:
        - "ALOS PALSAR"
        - "ALOS AVNIR-2"
        - ALOS-2
  - test-search-build_subquery S1-Platform:
      params:
        platform:
          - SENTINEL-1A
          - SENTINEL-1B
          - SENTINEL-1C
          - SENTINEL-1D
      expected:
        - shortName: *sentinel-1_shortnames

  - test-search-build_subquery NISAR-Dataset L0B:
      params:
        processingLevel:
          - L0B
        dataset:
          - NISAR
      expected: [{ processingLevel: ["RRSD"], shortName: *nisar_collections }]

  - test-search-build_subquery S1-Platform SLC:
      params:
        platform:
          - SENTINEL-1A
          - SENTINEL-1B
        processingLevel:
          - SLC
      expected:
        - shortName:
            - "SENTINEL-1A_SLC"
            - "SENTINEL-1B_SLC"
  - test-search-build_subquery S1-Dataset SLC:
      params:
        dataset:
          - SENTINEL-1
        processingLevel:
          - SLC
      expected:
        - shortName:
            - "SENTINEL-1A_SLC"
            - "SENTINEL-1B_SLC"
            - "SENTINEL-1C_SLC"
            - "SENTINEL-1D_SLC"
  - test-search-build_subquery UAVSAR POLSAR:
      params:
        processingLevel:
          - POLSAR
      expected:
        - shortName:
            - UAVSAR_POLSAR
  - test-search-build_subquery POLSAR & SLC Collection:
      params:
        processingLevel:
          - POLSAR
        collections:
          - C1214470488-ASF
          - C1205428742-ASF
          - C1234413245-ASFDEV
          - C1327985661-ASF
          - C1216244348-ASF
          - C1234413263-ASFDEV
      expected:
        [
          {
            shortName: UAVSAR_POLSAR,
            collections:
              [
                C1214470488-ASF,
                C1205428742-ASF,
                C1234413245-ASFDEV,
                C1327985661-ASF,
                C1216244348-ASF,
                C1234413263-ASFDEV,
              ],
          },
        ]
  - test-search-build_subquery POLSAR & SLC Collection with duplicate INTERFEROMETRY collection:
      params:
        processingLevel:
          - POLSAR
        collections:
          - C1214470488-ASF
          - C1205428742-ASF
          - C1234413245-ASFDEV
          - C1327985661-ASF
          - C1216244348-ASF
          - C1234413263-ASFDEV
          - C1212001698-ASF
      expected:
        [
          {
            shortName: UAVSAR_POLSAR,
            collections:
              [
                C1212001698-ASF,
                C1214470488-ASF,
                C1205428742-ASF,
                C1234413245-ASFDEV,
                C1327985661-ASF,
                C1216244348-ASF,
                C1234413263-ASFDEV,
              ],
          },
        ]
  - test-search-build_subquery UNKNOWN_PROCESSING_TYPE:
      params:
        processingLevel:
          - UNKNOWN_PROCESSING_TYPE
      expected: [{ processingLevel: [UNKNOWN_PROCESSING_TYPE] }]
  - test-search-build_subquery UNKNOWN_PROCESSING_TYPE with collections:
      params:
        processingLevel:
          - UNKNOWN_PROCESSING_TYPE
        collections:
          - C1214470488-ASF
          - C1205428742-ASF
          - C1234413245-ASFDEV
          - C1327985661-ASF
          - C1216244348-ASF
          - C1234413263-ASFDEV
          - C1212001698-ASF
      expected:
        [
          {
            processingLevel: [UNKNOWN_PROCESSING_TYPE],
            collections:
              [
                C1214470488-ASF,
                C1205428742-ASF,
                C1234413245-ASFDEV,
                C1327985661-ASF,
                C1216244348-ASF,
                C1234413263-ASFDEV,
                C1212001698-ASF,
              ],
          },
        ]
  - test-search-build_subquery mismatched processingLevel for platform:
      params:
        processingLevel: POLSAR
        platform: NISAR
      expected: [{ processingLevel: [POLSAR], platform: [NISAR] }]
  - test-search-build_subquery mismatched processingLevel for platform CSLC and S1A:
      params:
        processingLevel: POLSAR
        platform: SENTINEL-1A
      expected: [{ processingLevel: [POLSAR], platform: [SENTINEL-1A] }]
  - test-search-build_subquery UNKNOWN_PROCESSING_TYPE with platform, SLC, & collection (skip set difference with unknown processing level):
      params:
        platform:
          - SENTINEL-1A
          - SENTINEL-1B
          - UAVSAR
        processingLevel:
          - UNKNOWN_PROCESSING_TYPE
          - SLC
        collections:
          - C1212001698-ASF
      expected:
        [
          {
            processingLevel: UNKNOWN_PROCESSING_TYPE,
            collections: C1212001698-ASF,
            shortName:
              [
                "ARIA_S1_GUNW",
                "OPERA_L2_CSLC-S1-STATIC_V1",
                "OPERA_L2_CSLC-S1_CALVAL_V1",
                "OPERA_L2_CSLC-S1_V1",
                "OPERA_L2_RTC-S1-STATIC_V1",
                "OPERA_L2_RTC-S1_CALVAL_V1",
                "OPERA_L2_RTC-S1_V1",
                "SENTINEL-1A_DP_GRD_HIGH",
                "SENTINEL-1A_DP_GRD_MEDIUM",
                "SENTINEL-1A_DP_META_GRD_HIGH",
                "SENTINEL-1A_META_RAW",
                "SENTINEL-1A_META_SLC",
                "SENTINEL-1A_OCN",
                "SENTINEL-1A_RAW",
                "SENTINEL-1A_SLC",
                "SENTINEL-1A_SP_GRD_HIGH",
                "SENTINEL-1_INTERFEROGRAMS",
                "SENTINEL-1B_DP_GRD_HIGH",
                "SENTINEL-1B_DP_GRD_MEDIUM",
                "SENTINEL-1B_DP_META_GRD_HIGH",
                "SENTINEL-1B_DP_META_GRD_MEDIUM",
                "SENTINEL-1B_META_OCN",
                "SENTINEL-1B_META_RAW",
                "SENTINEL-1B_META_SLC",
                "SENTINEL-1B_SLC",
                "UAVSAR_POLSAR",
                "UAVSAR_RPI",
              ],
          },
        ]

  - test-search-build_subquery shortName:
      params:
        shortName: "newShortName"
      expected:
        - shortName: ["newShortName"]

  - test-search-build_subquery shortName multiple:
      params:
        shortName: ["newShortName", "oldShortName"]
      expected:
        - shortName: ["newShortName", "oldShortName"]

  - test-search-build_subquery cmr_keywords:
      params:
        cmr_keywords: ["attribute[]", "unique_value"]
      expected:
        - cmr_keywords: [["attribute[]", "unique_value"]]
  - test-search-build_subquery multiple cmr_keywords:
      params:
        cmr_keywords:
          [["attribute[]", "unique_value"], ["special_key", "special_value"]]
      expected:
        - cmr_keywords:
            [["attribute[]", "unique_value"], ["special_key", "special_value"]]

  - test-search-build_subquery configuration params:
      params:
        host: "cmr.uat.earthdata.nasa.gov"
        provider: "ASFDEV"
        product_list: ["S1_069649_IW1_20151201T232154_VV_73D6-BURST"]
      expected:
        [
          {
            host: "cmr.uat.earthdata.nasa.gov",
            provider: "ASFDEV",
            product_list: ["S1_069649_IW1_20151201T232154_VV_73D6-BURST"],
          },
        ]

  - test-aliasing-search-against-api SLC:
      params:
        processingLevel: SLC
        start: "2023-12-01T00:00:00Z"
        end: "2023-12-31T00:00:00Z"

  - test-aliasing-search-against-api S1A SLC:
      params:
        platform: SENTINEL-1A
        processingLevel: SLC
        start: "2023-12-01T00:00:00Z"
        end: "2023-12-31T00:00:00Z"

  - test-aliasing-search-against-api S1A RTC:
